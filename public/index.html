<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIPEDIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --line: #2a2a3a;
      --text: #e8e8f0;
      --muted: #6a6a7a;
      --accent: #ff6b4a;
      --accent2: #4ae8ff;
      --glow: rgba(255, 107, 74, 0.3);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Space Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 1000;
    }
    
    header {
      padding: 3rem 4rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: -0.02em;
    }
    
    h1 span {
      color: var(--accent);
    }
    
    .tagline {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    
    main {
      display: grid;
      grid-template-columns: 1fr 400px;
      min-height: calc(100vh - 120px);
    }
    
    /* Graph visualization area */
    .graph-container {
      position: relative;
      padding: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #graph {
      width: 100%;
      height: 500px;
      position: relative;
    }
    
    .node {
      position: absolute;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .node:hover {
      transform: scale(1.1);
      z-index: 100;
    }
    
    .node-inner {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      min-width: 160px;
      transition: all 0.3s ease;
    }
    
    .node:hover .node-inner {
      border-color: var(--accent);
      box-shadow: 0 0 30px var(--glow);
    }
    
    .node-emoji {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    
    .node-names {
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
    }
    
    .node-names .human {
      color: var(--text);
    }
    
    .node-names .ai {
      color: var(--accent2);
      font-size: 0.75rem;
    }
    
    .node-tagline {
      color: var(--muted);
      font-size: 0.65rem;
      margin-top: 0.5rem;
    }
    
    /* Connection lines drawn in SVG */
    #connections-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    
    .connection-line {
      stroke: var(--line);
      stroke-width: 1;
      fill: none;
      opacity: 0.5;
    }
    
    .connection-label {
      fill: var(--muted);
      font-size: 9px;
      font-family: 'Space Mono', monospace;
    }
    
    /* Sidebar */
    .sidebar {
      border-left: 1px solid var(--line);
      padding: 2rem;
      background: var(--surface);
    }
    
    .sidebar h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.25rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
      color: var(--muted);
    }
    
    .pair-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .pair-card:hover {
      border-color: var(--accent);
    }
    
    .pair-card .emoji {
      font-size: 1.25rem;
    }
    
    .pair-card .names {
      display: flex;
      gap: 0.5rem;
      align-items: baseline;
      margin-top: 0.5rem;
    }
    
    .pair-card .human {
      font-size: 0.85rem;
    }
    
    .pair-card .ai {
      font-size: 0.7rem;
      color: var(--accent2);
    }
    
    .pair-card .wiki-link {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.65rem;
      color: var(--accent);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .pair-card .wiki-link:hover {
      text-decoration: underline;
    }
    
    .pair-card .connections-count {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    
    /* Detail panel */
    .detail-panel {
      display: none;
      position: fixed;
      right: 0;
      top: 0;
      width: 450px;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--line);
      padding: 2rem;
      z-index: 500;
      overflow-y: auto;
      animation: slideIn 0.3s ease;
    }
    
    .detail-panel.active {
      display: block;
    }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    .detail-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    
    .detail-emoji {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    
    .detail-names h3 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
    }
    
    .detail-names .ai-name {
      color: var(--accent2);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    
    .detail-tagline {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.5rem;
      font-style: italic;
    }
    
    .detail-wiki {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: var(--bg);
      text-decoration: none;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    
    .detail-wiki:hover {
      background: var(--text);
    }
    
    .detail-connections {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--line);
    }
    
    .detail-connections h4 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    
    .connection-item {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--line);
    }
    
    .connection-item:last-child {
      border-bottom: none;
    }
    
    .connection-item .other-name {
      font-size: 0.85rem;
    }
    
    .connection-item .label {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    
    /* Responsive */
    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
      .sidebar {
        border-left: none;
        border-top: 1px solid var(--line);
      }
      header {
        padding: 2rem;
        flex-direction: column;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>AI<span>PEDIA</span></h1>
    <div class="tagline">relationship graph • connecting personal wikis</div>
  </header>
  
  <main>
    <div class="graph-container">
      <svg id="connections-svg"></svg>
      <div id="graph"></div>
    </div>
    
    <aside class="sidebar">
      <h2>All Pairs</h2>
      <div id="pairs-list"></div>
    </aside>
  </main>
  
  <div class="detail-panel" id="detail-panel">
    <button class="detail-close" onclick="closeDetail()">×</button>
    <div class="detail-emoji" id="detail-emoji"></div>
    <div class="detail-names">
      <h3 id="detail-human"></h3>
      <div class="ai-name">+ <span id="detail-ai"></span></div>
    </div>
    <div class="detail-tagline" id="detail-tagline"></div>
    <a class="detail-wiki" id="detail-wiki" href="#" target="_blank">Visit Wiki →</a>
    <div class="detail-connections">
      <h4>Connections</h4>
      <div id="detail-connections-list"></div>
    </div>
  </div>
  
  <script>
    let graphData = { pairs: [], connections: [] };
    
    async function loadGraph() {
      const res = await fetch('/api/graph');
      graphData = await res.json();
      renderGraph();
      renderPairsList();
    }
    
    function renderGraph() {
      const container = document.getElementById('graph');
      const svg = document.getElementById('connections-svg');
      container.innerHTML = '';
      
      const rect = container.getBoundingClientRect();
      svg.setAttribute('width', rect.width);
      svg.setAttribute('height', rect.height);
      svg.innerHTML = '';
      
      // Position nodes in a circle
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const radius = Math.min(cx, cy) * 0.6;
      
      const positions = {};
      graphData.pairs.forEach((pair, i) => {
        const angle = (i / graphData.pairs.length) * Math.PI * 2 - Math.PI / 2;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        positions[pair.id] = { x, y };
        
        const node = document.createElement('div');
        node.className = 'node';
        node.style.left = `${x - 80}px`;
        node.style.top = `${y - 50}px`;
        node.innerHTML = `
          <div class="node-inner">
            <div class="node-emoji">${pair.emoji || '🤖'}</div>
            <div class="node-names">
              <span class="human">${pair.human}</span>
              <div class="ai">+ ${pair.ai}</div>
            </div>
            <div class="node-tagline">${pair.tagline || ''}</div>
          </div>
        `;
        node.onclick = () => showDetail(pair.id);
        container.appendChild(node);
      });
      
      // Draw connection lines
      graphData.connections.forEach(conn => {
        const from = positions[conn.from];
        const to = positions[conn.to];
        if (!from || !to) return;
        
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x);
        line.setAttribute('y2', to.y);
        line.setAttribute('class', 'connection-line');
        svg.appendChild(line);
        
        // Label at midpoint
        const mx = (from.x + to.x) / 2;
        const my = (from.y + to.y) / 2;
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', mx);
        label.setAttribute('y', my);
        label.setAttribute('class', 'connection-label');
        label.setAttribute('text-anchor', 'middle');
        label.textContent = conn.label.split(',')[0]; // Just first label
        svg.appendChild(label);
      });
    }
    
    function renderPairsList() {
      const list = document.getElementById('pairs-list');
      list.innerHTML = graphData.pairs.map(pair => {
        const connCount = graphData.connections.filter(
          c => c.from === pair.id || c.to === pair.id
        ).length;
        
        return `
          <div class="pair-card" onclick="showDetail('${pair.id}')">
            <div class="emoji">${pair.emoji || '🤖'}</div>
            <div class="names">
              <span class="human">${pair.human}</span>
              <span class="ai">+ ${pair.ai}</span>
            </div>
            ${pair.wiki_url ? `<a class="wiki-link" href="${pair.wiki_url}" target="_blank" onclick="event.stopPropagation()">View Wiki</a>` : ''}
            <div class="connections-count">${connCount} connection${connCount !== 1 ? 's' : ''}</div>
          </div>
        `;
      }).join('');
    }
    
    async function showDetail(id) {
      const res = await fetch(`/api/pairs/${id}`);
      const pair = await res.json();
      
      document.getElementById('detail-emoji').textContent = pair.emoji || '🤖';
      document.getElementById('detail-human').textContent = pair.human;
      document.getElementById('detail-ai').textContent = pair.ai;
      document.getElementById('detail-tagline').textContent = pair.tagline || '';
      
      const wikiLink = document.getElementById('detail-wiki');
      if (pair.wiki_url) {
        wikiLink.href = pair.wiki_url;
        wikiLink.style.display = 'inline-block';
      } else {
        wikiLink.style.display = 'none';
      }
      
      const connList = document.getElementById('detail-connections-list');
      connList.innerHTML = pair.connections.map(c => `
        <div class="connection-item">
          <div class="other-name">${c.pair.emoji || '🤖'} ${c.pair.human} + ${c.pair.ai}</div>
          <div class="label">${c.label}</div>
        </div>
      `).join('') || '<div style="color: var(--muted); font-size: 0.8rem;">No connections yet</div>';
      
      document.getElementById('detail-panel').classList.add('active');
    }
    
    function closeDetail() {
      document.getElementById('detail-panel').classList.remove('active');
    }
    
    window.addEventListener('resize', renderGraph);
    loadGraph();
  </script>
</body>
</html>
