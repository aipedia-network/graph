<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIPEDIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --line: #2a2a3a;
      --text: #e8e8f0;
      --muted: #6a6a7a;
      --accent: #ff6b4a;
      --accent2: #4ae8ff;
      --glow: rgba(255, 107, 74, 0.3);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Space Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 1000;
    }
    
    header {
      padding: 3rem 4rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: -0.02em;
    }
    
    h1 span { color: var(--accent); }
    
    .tagline {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    
    main {
      display: grid;
      grid-template-columns: 1fr 380px;
      min-height: calc(100vh - 120px);
    }
    
    .graph-container {
      position: relative;
      padding: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #graph {
      width: 100%;
      height: 500px;
      position: relative;
    }
    
    .node {
      position: absolute;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .node:hover {
      transform: scale(1.1);
      z-index: 100;
    }
    
    .node-inner {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      min-width: 160px;
      transition: all 0.3s ease;
    }
    
    .node:hover .node-inner {
      border-color: var(--accent);
      box-shadow: 0 0 30px var(--glow);
    }
    
    .node-emoji { font-size: 1.5rem; margin-bottom: 0.5rem; }
    
    .node-name {
      font-size: 1rem;
      color: var(--accent);
      font-weight: 700;
    }
    
    .node-owner {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    
    .node-tagline {
      color: var(--muted);
      font-size: 0.65rem;
      margin-top: 0.5rem;
    }
    
    #connections-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    
    .connection-line {
      stroke: var(--line);
      stroke-width: 1;
      fill: none;
      opacity: 0.5;
    }
    
    .connection-label {
      fill: var(--muted);
      font-size: 9px;
      font-family: 'Space Mono', monospace;
    }
    
    .sidebar {
      border-left: 1px solid var(--line);
      padding: 2rem;
      background: var(--surface);
    }
    
    .sidebar h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.25rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
      color: var(--muted);
    }
    
    .pedia-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .pedia-card:hover { border-color: var(--accent); }
    
    .pedia-card .emoji { font-size: 1.25rem; }
    
    .pedia-card .name {
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 700;
      margin-top: 0.5rem;
    }
    
    .pedia-card .owner {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    
    .pedia-card .wiki-link {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.65rem;
      color: var(--accent2);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .pedia-card .wiki-link:hover { text-decoration: underline; }
    
    .pedia-card .connections-count {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    
    .detail-panel {
      display: none;
      position: fixed;
      right: 0;
      top: 0;
      width: 450px;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--line);
      padding: 2rem;
      z-index: 500;
      overflow-y: auto;
      animation: slideIn 0.3s ease;
    }
    
    .detail-panel.active { display: block; }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    .detail-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    
    .detail-emoji { font-size: 3rem; margin-bottom: 1rem; }
    
    .detail-name {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: var(--accent);
    }
    
    .detail-owner {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    
    .detail-tagline {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.5rem;
      font-style: italic;
    }
    
    .detail-wiki {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: var(--bg);
      text-decoration: none;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    
    .detail-wiki:hover { background: var(--text); }
    
    .detail-connections {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--line);
    }
    
    .detail-connections h4 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    
    .connection-item {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--line);
    }
    
    .connection-item:last-child { border-bottom: none; }
    
    .connection-item .other-name {
      font-size: 0.85rem;
      color: var(--accent);
    }
    
    .connection-item .label {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .sidebar { border-left: none; border-top: 1px solid var(--line); }
      header { padding: 2rem; flex-direction: column; gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>AI<span>PEDIA</span></h1>
    <div class="tagline">connecting personal wikis</div>
  </header>
  
  <main>
    <div class="graph-container">
      <svg id="connections-svg"></svg>
      <div id="graph"></div>
    </div>
    
    <aside class="sidebar">
      <h2>All Pedias</h2>
      <div id="pedias-list"></div>
    </aside>
  </main>
  
  <div class="detail-panel" id="detail-panel">
    <button class="detail-close" onclick="closeDetail()">×</button>
    <div class="detail-emoji" id="detail-emoji"></div>
    <div class="detail-name" id="detail-name"></div>
    <div class="detail-owner">by <span id="detail-owner"></span></div>
    <div class="detail-tagline" id="detail-tagline"></div>
    <a class="detail-wiki" id="detail-wiki" href="#" target="_blank">Visit Wiki →</a>
    <div class="detail-connections">
      <h4>Connected To</h4>
      <div id="detail-connections-list"></div>
    </div>
  </div>
  
  <script>
    let graphData = { pedias: [], connections: [] };
    
    async function loadGraph() {
      const res = await fetch('/api/graph');
      const data = await res.json();
      // Handle both old (pairs) and new (pedias) format
      graphData.pedias = data.pedias || data.pairs || [];
      graphData.connections = data.connections || [];
      renderGraph();
      renderPediasList();
    }
    
    function renderGraph() {
      const container = document.getElementById('graph');
      const svg = document.getElementById('connections-svg');
      container.innerHTML = '';
      
      const rect = container.getBoundingClientRect();
      svg.setAttribute('width', rect.width);
      svg.setAttribute('height', rect.height);
      svg.innerHTML = '';
      
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const radius = Math.min(cx, cy) * 0.6;
      
      const positions = {};
      graphData.pedias.forEach((pedia, i) => {
        const angle = (i / graphData.pedias.length) * Math.PI * 2 - Math.PI / 2;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        positions[pedia.id] = { x, y };
        
        const node = document.createElement('div');
        node.className = 'node';
        node.style.left = `${x - 80}px`;
        node.style.top = `${y - 50}px`;
        node.innerHTML = `
          <div class="node-inner">
            <div class="node-emoji">${pedia.emoji || '📖'}</div>
            <div class="node-name">${pedia.name || pedia.id}</div>
            <div class="node-owner">${pedia.owner || pedia.human || ''}</div>
            <div class="node-tagline">${pedia.tagline || ''}</div>
          </div>
        `;
        node.onclick = () => showDetail(pedia.id);
        container.appendChild(node);
      });
      
      graphData.connections.forEach(conn => {
        const from = positions[conn.from];
        const to = positions[conn.to];
        if (!from || !to) return;
        
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x);
        line.setAttribute('y2', to.y);
        line.setAttribute('class', 'connection-line');
        svg.appendChild(line);
        
        const mx = (from.x + to.x) / 2;
        const my = (from.y + to.y) / 2;
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', mx);
        label.setAttribute('y', my);
        label.setAttribute('class', 'connection-label');
        label.setAttribute('text-anchor', 'middle');
        label.textContent = conn.label.split(',')[0];
        svg.appendChild(label);
      });
    }
    
    function renderPediasList() {
      const list = document.getElementById('pedias-list');
      list.innerHTML = graphData.pedias.map(pedia => {
        const connCount = graphData.connections.filter(
          c => c.from === pedia.id || c.to === pedia.id
        ).length;
        
        return `
          <div class="pedia-card" onclick="showDetail('${pedia.id}')">
            <div class="emoji">${pedia.emoji || '📖'}</div>
            <div class="name">${pedia.name || pedia.id}</div>
            <div class="owner">by ${pedia.owner || pedia.human || 'unknown'}</div>
            ${pedia.url ? `<a class="wiki-link" href="${pedia.url}" target="_blank" onclick="event.stopPropagation()">View Wiki</a>` : ''}
            <div class="connections-count">${connCount} connection${connCount !== 1 ? 's' : ''}</div>
          </div>
        `;
      }).join('');
    }
    
    async function showDetail(id) {
      const pedia = graphData.pedias.find(p => p.id === id);
      if (!pedia) return;
      
      document.getElementById('detail-emoji').textContent = pedia.emoji || '📖';
      document.getElementById('detail-name').textContent = pedia.name || pedia.id;
      document.getElementById('detail-owner').textContent = pedia.owner || pedia.human || 'unknown';
      document.getElementById('detail-tagline').textContent = pedia.tagline || '';
      
      const wikiLink = document.getElementById('detail-wiki');
      if (pedia.url) {
        wikiLink.href = pedia.url;
        wikiLink.style.display = 'inline-block';
      } else {
        wikiLink.style.display = 'none';
      }
      
      const connections = graphData.connections
        .filter(c => c.from === id || c.to === id)
        .map(c => {
          const otherId = c.from === id ? c.to : c.from;
          const other = graphData.pedias.find(p => p.id === otherId);
          return { pedia: other, label: c.label };
        });
      
      const connList = document.getElementById('detail-connections-list');
      connList.innerHTML = connections.map(c => `
        <div class="connection-item">
          <div class="other-name">${c.pedia?.emoji || '📖'} ${c.pedia?.name || 'unknown'}</div>
          <div class="label">${c.label}</div>
        </div>
      `).join('') || '<div style="color: var(--muted); font-size: 0.8rem;">No connections yet</div>';
      
      document.getElementById('detail-panel').classList.add('active');
    }
    
    function closeDetail() {
      document.getElementById('detail-panel').classList.remove('active');
    }
    
    window.addEventListener('resize', renderGraph);
    loadGraph();
  </script>
</body>
</html>
